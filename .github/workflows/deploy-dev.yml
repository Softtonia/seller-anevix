name: Deploy Anevix Seller - Dev

on:
  push:
    branches:
      - dev

  workflow_dispatch:

concurrency:
  group: anevix-seller-dev
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: anevix-seller
  BASE_PATH: /var/www/seller.anevix.in
  NODE_ENV: production

jobs:
  deploy:
    name: Build & Deploy Anevix Seller
    runs-on: ubuntu-latest
    environment: dev

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v5

      # ---------------------------------------------------------
      # Detect Project
      # ---------------------------------------------------------

      - name: Check Next.js Project
        id: project_check
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          if ! grep -q '"next"' package.json; then
            echo "ERROR: Next.js dependency not found in package.json"
            exit 1
          fi

          echo "Next.js project detected"

      # ---------------------------------------------------------
      # Node
      # ---------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.8.0'
          cache: npm

      # ---------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "Using npm ci"

            npm ci \
              --legacy-peer-deps \
              --no-audit \
              --no-fund
          else
            echo "package-lock.json not found"
            echo "Using npm install"

            npm install \
              --legacy-peer-deps \
              --no-audit \
              --no-fund
          fi

      # ---------------------------------------------------------
      # Environment
      # ---------------------------------------------------------

      - name: Create Production Environment
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        shell: bash
        run: |
          set -euo pipefail

          rm -f .env.production

          touch .env.production

          if [ -n "${NEXT_PUBLIC_API_URL:-}" ]; then
            printf 'NEXT_PUBLIC_API_URL=%s\n' "$NEXT_PUBLIC_API_URL" >> .env.production
          fi

          if [ -n "${NEXT_PUBLIC_APP_URL:-}" ]; then
            printf 'NEXT_PUBLIC_APP_URL=%s\n' "$NEXT_PUBLIC_APP_URL" >> .env.production
          fi

          echo ".env.production created"

      # ---------------------------------------------------------
      # Validate important files before build
      # ---------------------------------------------------------

      - name: Validate Source Files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository..."

          git status --short

          echo ""
          echo "Next.js version:"
          node -p "require('./node_modules/next/package.json').version"

          echo ""
          echo "Checking components directory..."

          if [ -d components ]; then
            find components -maxdepth 2 -type f | sort | head -200
          else
            echo "WARNING: components directory not found"
          fi

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------

      - name: Build Next.js Application
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .next

          npm run build

      # ---------------------------------------------------------
      # Verify Build
      # ---------------------------------------------------------

      - name: Verify Next.js Build
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d ".next" ]; then
            echo "ERROR: .next directory was not created"
            exit 1
          fi

          echo "Next.js build completed"

          du -sh .next

      # ---------------------------------------------------------
      # Prepare Deployment Package
      # ---------------------------------------------------------

      - name: Prepare Deployment Package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deployment

          mkdir -p deployment

          cp -r .next deployment/.next

          if [ -d public ]; then
            cp -r public deployment/public
          fi

          cp package.json deployment/package.json

          if [ -f package-lock.json ]; then
            cp package-lock.json deployment/package-lock.json
          fi

          if [ -f next.config.js ]; then
            cp next.config.js deployment/next.config.js
          fi

          if [ -f next.config.mjs ]; then
            cp next.config.mjs deployment/next.config.mjs
          fi

          if [ -f next.config.ts ]; then
            cp next.config.ts deployment/next.config.ts
          fi

          if [ -f next.config.cjs ]; then
            cp next.config.cjs deployment/next.config.cjs
          fi

          if [ -f .env.production ]; then
            cp .env.production deployment/.env.production
          fi

          echo "${GITHUB_SHA}" > deployment/deploy-version.txt

          echo "Deployment package:"
          find deployment -maxdepth 2 -type f | sort | head -200

      # ---------------------------------------------------------
      # Archive
      # ---------------------------------------------------------

      - name: Create Deployment Archive
        shell: bash
        run: |
          set -euo pipefail

          tar \
            --exclude='.DS_Store' \
            -czf seller-build.tar.gz \
            -C deployment \
            .

          ls -lh seller-build.tar.gz

      # ---------------------------------------------------------
      # SSH
      # ---------------------------------------------------------

      - name: Setup SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          SSH_PORT="${SERVER_PORT:-22}"

          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/seller_key

          chmod 600 ~/.ssh/seller_key

          ssh-keyscan \
            -p "$SSH_PORT" \
            -H "$SERVER_HOST" \
            >> ~/.ssh/known_hosts

      # ---------------------------------------------------------
      # Upload
      # ---------------------------------------------------------

      - name: Upload Deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/seller_key \
            -p "$SSH_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$BASE_PATH/releases' '$BASE_PATH/.deploy_tmp'"

          scp \
            -i ~/.ssh/seller_key \
            -P "$SSH_PORT" \
            seller-build.tar.gz \
            "$SERVER_USER@$SERVER_HOST:$BASE_PATH/.deploy_tmp/seller-build-${GITHUB_SHA}.tar.gz"

      # ---------------------------------------------------------
      # Activate
      # ---------------------------------------------------------

      - name: Activate Deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/seller_key \
            -p "$SSH_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "BASE_PATH='$BASE_PATH' APP_NAME='$APP_NAME' GIT_SHA='$GIT_SHA' bash -s" <<'SERVER_SCRIPT'

            set -euo pipefail

            RELEASE="$BASE_PATH/releases/$GIT_SHA"
            ARCHIVE="$BASE_PATH/.deploy_tmp/seller-build-$GIT_SHA.tar.gz"

            echo "======================================"
            echo "Deploying Anevix Seller"
            echo "Release: $GIT_SHA"
            echo "======================================"

            # -------------------------------------------------
            # Prepare release
            # -------------------------------------------------

            rm -rf "$RELEASE"

            mkdir -p "$RELEASE"

            # -------------------------------------------------
            # Extract
            # -------------------------------------------------

            tar \
              -xzf "$ARCHIVE" \
              -C "$RELEASE"

            # -------------------------------------------------
            # Validate
            # -------------------------------------------------

            if [ ! -d "$RELEASE/.next" ]; then
              echo "ERROR: .next directory missing"
              exit 1
            fi

            if [ ! -f "$RELEASE/package.json" ]; then
              echo "ERROR: package.json missing"
              exit 1
            fi

            # -------------------------------------------------
            # Version
            # -------------------------------------------------

            echo "$GIT_SHA" > "$RELEASE/deploy-version.txt"

            # -------------------------------------------------
            # Install production dependencies
            # -------------------------------------------------

            cd "$RELEASE"

            if [ -f package-lock.json ]; then

              echo "Installing production dependencies..."

              npm ci \
                --omit=dev \
                --legacy-peer-deps \
                --no-audit \
                --no-fund

            else

              echo "package-lock.json not found"

              npm install \
                --omit=dev \
                --legacy-peer-deps \
                --no-audit \
                --no-fund

            fi

            # -------------------------------------------------
            # Remove temporary archive
            # -------------------------------------------------

            rm -f "$ARCHIVE"

            # -------------------------------------------------
            # Current symlink
            # -------------------------------------------------

            ln -sfn "$RELEASE" "$BASE_PATH/current"

            # -------------------------------------------------
            # PM2
            # -------------------------------------------------

            if command -v pm2 >/dev/null 2>&1; then

              echo "PM2 detected"

            else

              echo "ERROR: PM2 is not installed"
              echo "Install PM2 on server first:"
              echo "sudo npm install -g pm2"

              exit 1

            fi

            # -------------------------------------------------
            # Start / Restart application
            # -------------------------------------------------

            cd "$BASE_PATH/current"

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then

              echo "Restarting existing application..."

              pm2 restart "$APP_NAME" \
                --update-env

            else

              echo "Starting application..."

              pm2 start npm \
                --name "$APP_NAME" \
                -- start

            fi

            # -------------------------------------------------
            # Save PM2 process list
            # -------------------------------------------------

            pm2 save

            # -------------------------------------------------
            # Show status
            # -------------------------------------------------

            pm2 status

            # -------------------------------------------------
            # Cleanup old releases
            # Keep latest 5
            # -------------------------------------------------

            cd "$BASE_PATH/releases"

            ls -1dt */ 2>/dev/null \
              | tail -n +6 \
              | xargs -r rm -rf || true

            echo "======================================"
            echo "Deployment successful"
            echo "Release: $GIT_SHA"
            echo "======================================"

          SERVER_SCRIPT

      # ---------------------------------------------------------
      # Verify Website
      # ---------------------------------------------------------

      - name: Verify Deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking https://seller.anevix.in"

          HTTP_CODE=$(curl \
            -L \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 30 \
            https://seller.anevix.in)

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Website verification failed"
            exit 1
          fi

          echo "======================================"
          echo "Seller deployment verified"
          echo "https://seller.anevix.in"
          echo "======================================"
