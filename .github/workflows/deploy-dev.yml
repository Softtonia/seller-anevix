name: Deploy Anevix Seller - Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: anevix-seller-dev
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BASE_PATH: /var/www/seller.anevix.in

jobs:
  deploy:
    name: Build & Deploy Anevix Seller
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Check React Project Exists
        id: project_check
        run: |
          if [ -f package.json ]; then
            echo "project_exists=true" >> "$GITHUB_OUTPUT"
            echo "React project detected"
          else
            echo "project_exists=false" >> "$GITHUB_OUTPUT"
            echo "React project not added yet. Skipping deployment."
          fi

      - name: Setup Node.js
        if: steps.project_check.outputs.project_exists == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24.8.0'
          cache: npm

      - name: Install Dependencies
        if: steps.project_check.outputs.project_exists == 'true'
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Create Environment
        if: steps.project_check.outputs.project_exists == 'true'
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -n "${VITE_API_URL:-}" ]; then
            printf 'VITE_API_URL=%s\n' "$VITE_API_URL" > .env.production
          fi

      - name: Build React App
        if: steps.project_check.outputs.project_exists == 'true'
        run: |
          set -euo pipefail

          rm -rf dist build

          npm run build

      - name: Detect Build Directory
        if: steps.project_check.outputs.project_exists == 'true'
        run: |
          set -euo pipefail

          if [ -f dist/index.html ]; then
            echo "BUILD_DIR=dist" >> "$GITHUB_ENV"
            echo "Build directory: dist"

          elif [ -f build/index.html ]; then
            echo "BUILD_DIR=build" >> "$GITHUB_ENV"
            echo "Build directory: build"

          else
            echo "ERROR: Build output not found"
            exit 1
          fi

      - name: Create Build Archive
        if: steps.project_check.outputs.project_exists == 'true'
        run: |
          set -euo pipefail

          tar -czf seller-build.tar.gz -C "$BUILD_DIR" .

          echo "Build archive created:"
          ls -lh seller-build.tar.gz

      - name: Setup SSH
        if: steps.project_check.outputs.project_exists == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          SSH_PORT="${SERVER_PORT:-22}"

          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/seller_key
          chmod 600 ~/.ssh/seller_key

          ssh-keyscan \
            -p "$SSH_PORT" \
            -H "$SERVER_HOST" \
            >> ~/.ssh/known_hosts

      - name: Upload Build
        if: steps.project_check.outputs.project_exists == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/seller_key \
            -p "$SSH_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$BASE_PATH/releases' '$BASE_PATH/.deploy_tmp'"

          scp \
            -i ~/.ssh/seller_key \
            -P "$SSH_PORT" \
            seller-build.tar.gz \
            "$SERVER_USER@$SERVER_HOST:$BASE_PATH/.deploy_tmp/seller-build-${GITHUB_SHA}.tar.gz"

      - name: Activate Release
        if: steps.project_check.outputs.project_exists == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/seller_key \
            -p "$SSH_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "BASE_PATH='$BASE_PATH' GIT_SHA='$GIT_SHA' bash -s" <<'SERVER_SCRIPT'

            set -euo pipefail

            RELEASE="$BASE_PATH/releases/$GIT_SHA"
            ARCHIVE="$BASE_PATH/.deploy_tmp/seller-build-$GIT_SHA.tar.gz"

            rm -rf "$RELEASE"
            mkdir -p "$RELEASE"

            echo "Extracting release..."

            tar -xzf "$ARCHIVE" -C "$RELEASE"

            if [ ! -f "$RELEASE/index.html" ]; then
              echo "ERROR: index.html missing from release"
              exit 1
            fi

            echo "$GIT_SHA" > "$RELEASE/deploy-version.txt"

            echo "Updating current release..."

            ln -sfn "$RELEASE" "$BASE_PATH/current"

            echo "Updating Nginx dist directory..."

            rm -rf "$BASE_PATH/dist"

            ln -s "$RELEASE" "$BASE_PATH/dist"

            rm -f "$ARCHIVE"

            echo "Cleaning old releases..."

            cd "$BASE_PATH/releases"

            ls -1dt */ 2>/dev/null \
              | tail -n +6 \
              | xargs -r rm -rf || true

            echo "===================================="
            echo "Anevix Seller deployed successfully"
            echo "Commit: $GIT_SHA"
            echo "Release: $RELEASE"
            echo "===================================="

          SERVER_SCRIPT

      - name: Verify Deployment
        if: steps.project_check.outputs.project_exists == 'true'
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl \
            -L \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            https://seller.anevix.in)

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Deployment verification failed"
            exit 1
          fi

          echo "Seller deployment verified successfully."

      - name: Project Not Added Yet
        if: steps.project_check.outputs.project_exists == 'false'
        run: |
          echo "===================================="
          echo "Anevix Seller project not present yet"
          echo "Workflow is ready"
          echo "Deployment skipped"
          echo "===================================="
